<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A sidewalk street-name tile: cobalt letters on white, double cobalt border. -->
  <rect width="64" height="64" rx="12" fill="#1f4fa3"/>
  <rect x="7" y="7" width="50" height="50" rx="3" fill="#ffffff"/>
  <rect x="10.5" y="10.5" width="43" height="43" rx="1.5" fill="none" stroke="#1f4fa3" stroke-width="2"/>
  <g fill="#1f4fa3" font-family="Atkinson Hyperlegible Next, Verdana, sans-serif" font-weight="800" font-size="17" text-anchor="middle">
    <text x="23.5" y="30">N</text><text x="40.5" y="30">O</text>
    <text x="23.5" y="48">L</text><text x="40.5" y="48">A</text>
  </g>
</svg>
