# NORTA publishes a new timetable a few times a year. This checks weekly,
# rebuilds the data, and commits it if anything changed, so the app never
# runs on an expired schedule.
name: Refresh timetable

on:
  schedule:
    - cron: '17 11 * * 1' # Mondays, early morning in New Orleans
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data -- --fetch
      - run: npm test
      - name: Commit if the timetable changed
        run: |
          if git diff --quiet -- public/data shared/generated; then
            echo "Timetable unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data shared/generated
          git commit -m "Update NORTA timetable"
          git push
